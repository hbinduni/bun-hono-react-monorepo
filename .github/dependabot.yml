version: 2
updates:
  - package-ecosystem: bun
    open-pull-requests-limit: 0
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    open-pull-requests-limit: 0
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directories:
      - /client
      - /k8s
      - /server
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
